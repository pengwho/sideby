<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>塞唄 Sideby</title>
<meta name="description" content="塞得下嗎？塞唄幫你先塞塞看：IKEA BILLY、KALLAX 等櫃子適合放哪些收納盒？3D 模擬每層怎麼擺、能不能疊、要買幾個，附實測尺寸與購買連結。">
<meta property="og:title" content="塞唄 Sideby｜先塞塞看，再下單">
<meta property="og:description" content="看收納盒放進 BILLY、KALLAX 每層怎麼擺、要買幾個。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: mobile-first. Combo strip → 3D stage → details & shopping list. Desktop: strip on top, stage left (sticky), details right. Accent = tape-measure yellow. */
:root{
  --bg:#EDF0EE; --panel:#FFFFFF; --ink:#1C272A; --muted:#5A686B; --line:#D2D9D6;
  --accent:#D69A00; --accent-ink:#2E2200; --accent-soft:#FBEFC8;
  --ok:#2E7D55; --ok-soft:#DDF0E5; --warn:#B8501E; --warn-soft:#F8E3D8;
  --stage:#E2E7E5; --wood:#F6F5F0; --edge:#1C272A; --boxwarn:#E0873A; --book:#A9B3B1;
  --box1:#5E979C; --box2:#8B6FA8; --box3:#6E8F4E; --box4:#B07A5B;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121819; --panel:#1A2224; --ink:#E4EBE9; --muted:#9AA9AC; --line:#2C3739;
  --accent:#F0B429; --accent-ink:#2A1E00; --accent-soft:#3A2F12;
  --ok:#5CC48E; --ok-soft:#173226; --warn:#F08A5D; --warn-soft:#3A2018;
  --stage:#0E1415; --wood:#D8D5CC; --edge:#0B1112; --boxwarn:#F09A50; --book:#7D8886;
  --box1:#6FAEB3; --box2:#A68CC2; --box3:#86A866; --box4:#C99373;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121819; --panel:#1A2224; --ink:#E4EBE9; --muted:#9AA9AC; --line:#2C3739;
  --accent:#F0B429; --accent-ink:#2A1E00; --accent-soft:#3A2F12;
  --ok:#5CC48E; --ok-soft:#173226; --warn:#F08A5D; --warn-soft:#3A2018;
  --stage:#0E1415; --wood:#D8D5CC; --edge:#0B1112; --boxwarn:#F09A50; --book:#7D8886;
  --box1:#6FAEB3; --box2:#A68CC2; --box3:#86A866; --box4:#C99373;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{padding-block:14px 0}
.brand{display:flex;align-items:baseline;gap:6px 10px;flex-wrap:wrap}
.brand b{font-weight:700;font-size:26px;letter-spacing:.04em;line-height:1.1}
.brand .en{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.08em;color:var(--muted)}
.brand .tag{font-size:14px;font-weight:700}
.labtag{font-size:12px;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:0 10px}
.ruler{height:12px;margin-top:10px;border-bottom:1px solid var(--ink);opacity:.5;
  background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 50px) bottom/100% 10px no-repeat,
             repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 10px) bottom/100% 5px no-repeat}

/* combo picker */
.picker{padding-block:12px 4px;display:flex;flex-direction:column;gap:8px}
.scroller{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.fchip{flex:0 0 auto;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ccard{flex:0 0 200px;scroll-snap-align:start;text-align:left;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.ccard[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.ccard .cab{font-size:11px;color:var(--muted);letter-spacing:.04em}
.ccard .ttl{font-weight:700;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard .meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dots{display:flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:2px;display:block}
.ccard .meta b{font-family:var(--mono);color:var(--ink);margin-left:auto}

/* main view */
.view{display:grid;gap:14px;padding-block:8px 32px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){
  .view{grid-template-columns:minmax(0,1.25fr) minmax(360px,1fr);align-items:start;gap:20px}
  .stagecol{position:sticky;top:12px}
}
.stagecol,.detail{min-width:0}
.detail{display:flex;flex-direction:column;gap:14px}
.stage{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:8px;height:clamp(300px,54vh,470px);overflow:hidden}
@media (min-width:900px){.stage{height:min(76vh,700px)}}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.views{position:absolute;left:8px;top:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap}
.views button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}
.views button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.views .sep{flex:1}
.views #dimToggle[aria-pressed="true"]{background:var(--panel);border-color:var(--accent);color:var(--ink)}
.views #dimToggle[aria-pressed="true"]::before{content:"✓ ";color:var(--accent);font-weight:700}
.legend{position:absolute;left:8px;bottom:8px;display:flex;gap:10px;flex-wrap:wrap;font-size:11px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 8px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
@media (max-width:599px){.legend{display:none}}
.hintline{font-size:12px;color:var(--muted);margin:6px 2px 0}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--muted)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.panel h2{margin:0;font-size:20px;line-height:1.3;text-wrap:balance}
.panel h3{margin:0;font-size:15px}
.note{margin:0;color:var(--muted);max-width:68ch}
.total{font-size:15px}
.total b{font-family:var(--mono);font-size:24px;background:var(--accent-soft);padding:0 8px;border-radius:3px;font-variant-numeric:tabular-nums}
.chip{font-size:12px;border-radius:999px;padding:1px 9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:700}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn);font-weight:700}
.gallery{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.gthumb{flex:0 0 auto;width:96px;height:96px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--bg);padding:0;cursor:pointer;position:relative}
.gthumb img,.gthumb video{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:auto auto 6px 6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:999px;padding:1px 8px}

/* shopping list */
.items{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start;border-top:1px solid var(--line);padding-top:10px}
.item:first-child{border-top:0;padding-top:0}
.ithumb{width:96px;height:96px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--bg);position:relative;padding:0;cursor:pointer;display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center}
.ithumb[disabled]{cursor:default}
.ithumb img,.ithumb video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ithumb .sw{position:absolute;left:6px;top:6px;width:12px;height:12px;border-radius:3px;z-index:1}
.ithumb .more{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:999px;padding:0 7px;z-index:1}
.ibody{display:flex;flex-direction:column;gap:3px;min-width:0}
.iname{font-weight:700;line-height:1.35}
.ispec{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.iqty{font-size:13px}
.iqty b{font-family:var(--mono);font-size:16px}
.buys{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.buy{font-size:13px;font-weight:700;text-decoration:none;border-radius:6px;padding:6px 14px;border:1px solid var(--ink);color:var(--ink)}
.buy.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.buy.off{border-style:dashed;border-color:var(--line);color:var(--muted);font-weight:500}
.badge{font-size:11px;border-radius:999px;padding:0 8px;align-self:flex-start}
.badge.v{background:var(--ok-soft);color:var(--ok);font-weight:700}
.badge.c{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

details.lv summary{cursor:pointer;font-weight:700;font-size:15px}
details.lv[open] summary{margin-bottom:8px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);white-space:nowrap}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td i.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
thead th{font-size:12px;border-bottom:1px solid var(--ink)}
tbody tr.bad td{color:var(--warn)}
tbody tr.sel td{background:var(--accent-soft)}
.lvtable tbody tr{cursor:pointer}
.notes{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.notes li.w{color:var(--warn)}
.foot{font-size:12px;color:var(--muted);margin:0;max-width:75ch}

/* buy bar (phone) */
.buybar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.buybar span{font-size:14px;flex:1}
.buybar b{font-family:var(--mono);font-size:18px}
.buybar button{font:inherit;font-weight:700;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);padding:9px 16px;cursor:pointer}
@media (min-width:900px){.buybar{display:none!important}}
body.hasbar{padding-bottom:72px}
@media (min-width:900px){body.hasbar{padding-bottom:0}}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:50;background:#0B0F10;color:#F2F5F4;display:flex;flex-direction:column}
.lbbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.lbbar button{font:inherit;font-size:14px;background:#26302F;color:#F2F5F4;border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
.lbtrack{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;min-height:0}
.lbslide{flex:0 0 100%;scroll-snap-align:center;display:grid;place-items:center;padding:0 12px calc(16px + env(safe-area-inset-bottom,0px));min-height:0}
.lbslide img,.lbslide video{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lbslide iframe{border:0;border-radius:8px;width:min(100%,calc((100vh - 120px)*9/16));aspect-ratio:9/16;max-height:100%}
.lbslide iframe.wide{width:min(100%,960px);aspect-ratio:16/9}

/* lab */
fieldset,details.adv{border:1px solid var(--line);background:var(--panel);border-radius:8px;margin:0;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font-weight:700;font-size:13px;letter-spacing:.06em;padding:0 6px}
details.adv{display:block}
details.adv summary{cursor:pointer;font-weight:700;font-size:13px}
details.adv[open] summary{margin-bottom:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:12px;color:var(--muted)}
.unit{position:relative}
.unit input{padding-right:30px}
.unit::after{content:attr(data-u);position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);font-family:var(--mono);pointer-events:none}
input[type=number],input[type=text],input[type=url],input[type=password],select,textarea{width:100%;font:inherit;font-family:var(--mono);font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
@media (min-width:900px){input[type=number],input[type=text],input[type=url],input[type=password],select,textarea{font-size:14px}}
input[type=text],select,textarea{font-family:var(--sans)}
textarea{resize:vertical;min-height:60px}
input[type=file]{font:inherit;font-size:13px;max-width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sec{font-size:12px;font-weight:700;margin-top:2px;display:flex;align-items:center;gap:6px}
.sec::after{content:"";flex:1;border-top:1px dashed var(--line)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.row{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center}
.hint{font-size:12px;color:var(--muted);margin:0}
.levels{display:flex;flex-direction:column;gap:6px}
.lvrow{display:grid;grid-template-columns:64px minmax(0,1fr) 34px;gap:8px;align-items:center}
.lvrow span{font-size:12px;color:var(--muted);white-space:nowrap}
.lvrow.sel span{color:var(--ink);font-weight:700}
.lvrow.sel input{border-color:var(--accent)}
.iconbtn{width:34px;height:34px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:6px;cursor:pointer;font-size:16px;line-height:1}
.iconbtn:disabled{opacity:.35;cursor:default}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.mlist{display:flex;gap:8px;flex-wrap:wrap}
.mitem{position:relative;width:72px;height:72px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:11px;color:var(--muted);text-align:center}
.mitem img,.mitem video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.mitem button{position:absolute;right:2px;top:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;z-index:1;line-height:1}
.mitem .new{position:absolute;left:3px;bottom:3px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 6px;font-size:10px;font-weight:700;z-index:1}
.status{font-size:13px;margin:0}
.status.ok{color:var(--ok)}
.status.err{color:var(--warn)}
.clvrow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;align-items:center}
.clvrow span{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="top wrap">
  <div class="brand"><b>塞唄</b><span class="en">Sideby</span><span class="tag">先塞塞看，再下單</span><span class="labtag" id="labTag" hidden>測試模式</span></div>
  <div class="ruler" aria-hidden="true"></div>
</header>

<section class="picker wrap" id="picker" aria-label="推薦組合">
  <div class="scroller" id="filters" role="group" aria-label="依櫃子篩選"></div>
  <div class="scroller" id="combos"></div>
</section>

<main class="wrap view">
  <section class="stagecol">
    <div class="stage" id="stage">
      <div class="views" role="group" aria-label="視角">
        <button type="button" data-view="angle" aria-pressed="true">斜角</button>
        <button type="button" data-view="front" aria-pressed="false">正面</button>
        <button type="button" data-view="side" aria-pressed="false">側面</button>
        <button type="button" data-view="cell" aria-pressed="false">單層</button>
        <span class="sep"></span>
        <button type="button" id="dimToggle" aria-pressed="true">剩餘尺寸</button>
      </div>
      <div class="legend" aria-hidden="true">
        <span><i style="background:var(--accent)"></i>剩餘空間</span>
        <span><i style="background:var(--book)"></i>放書</span>
        <span><i style="background:var(--boxwarn)"></i>凸出櫃外</span>
      </div>
    </div>
    <p class="hintline">拖曳旋轉、雙指縮放。點櫃子的任一層可以放大看那一層的剩餘空間，再點一次回到全櫃。</p>
  </section>

  <section class="detail">
    <div class="panel" id="result"></div>
    <div class="panel" id="shop"></div>

    <!-- 測試模式 -->
    <div class="stack" id="labPanel" hidden>
      <fieldset>
        <legend>櫃子</legend>
        <div class="f"><label for="cabPreset">櫃型</label><select id="cabPreset"></select></div>
        <div class="grid3">
          <div class="f"><label for="cw">內寬</label><div class="unit" data-u="cm"><input id="cw" type="number" inputmode="decimal" step="0.1" min="5"></div></div>
          <div class="f"><label for="cd">內深</label><div class="unit" data-u="cm"><input id="cd" type="number" inputmode="decimal" step="0.1" min="5"></div></div>
          <div class="f"><label for="ccols">欄數</label><input id="ccols" type="number" inputmode="numeric" step="1" min="1" max="6"></div>
        </div>
        <div class="sec">每層淨高（由上往下）</div>
        <div class="levels" id="levels"></div>
        <button type="button" class="btn" id="addLv" style="align-self:flex-start">＋ 加一層</button>
      </fieldset>

      <fieldset>
        <legend>收納盒</legend>
        <div class="f"><label for="boxPreset">盒子</label><select id="boxPreset"></select></div>
        <div class="f"><label for="bname">名稱</label><input id="bname" type="text"></div>
        <div class="sec">上緣外尺寸</div>
        <div class="grid2">
          <div class="f"><label for="btw">寬</label><div class="unit" data-u="cm"><input id="btw" type="number" inputmode="decimal" step="0.1" min="1"></div></div>
          <div class="f"><label for="btd">深</label><div class="unit" data-u="cm"><input id="btd" type="number" inputmode="decimal" step="0.1" min="1"></div></div>
        </div>
        <div class="sec">底部外尺寸與高度</div>
        <div class="grid3">
          <div class="f"><label for="bbw">底寬</label><div class="unit" data-u="cm"><input id="bbw" type="number" inputmode="decimal" step="0.1" min="1"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* 資料在 catalog.json。平常新增商品請用 pengwho.com/sideby/#lab 的「發佈到網站」，不用改程式。 */
(async function(){
const REPO='pengwho/sideby';
const MAXLV=10, DEF={over:0,gap:0.5,sgap:1,tgap:1}, BOXCOL=['--box1','--box2','--box3','--box4'];
const VIDEO_MAX=25*1024*1024;
const $=id=>document.getElementById(id);
const num=id=>{const v=parseFloat($(id).value);return isFinite(v)?v:0;};
const f1=n=>{const r=Math.round(n*10)/10;return (Object.is(r,-0)?0:r).toString();};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888';
const isLab=()=>location.hash==='#lab';
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}}};

let CATALOG;
try{const r=await fetch('catalog.json',{cache:'no-cache'});if(!r.ok)throw new Error(r.status);CATALOG=await r.json();}
catch(e){$('result').textContent='組合資料載入失敗，請重新整理頁面。';console.error(e);return;}
CATALOG.cabinets=CATALOG.cabinets||{};CATALOG.boxes=CATALOG.boxes||{};CATALOG.combos=CATALOG.combos||[];

const colorVar=id=>{const i=Object.keys(CATALOG.boxes).indexOf(id);return BOXCOL[(i<0?0:i)%BOXCOL.length];};
const shortName=n=>String(n).replace(/（.*?）/g,'');
function mediaOf(x){const m=(x&&x.media||[]).slice();(x&&x.photos||[]).forEach(p=>m.push({type:'image',src:p}));return m;}
const ytThumb=id=>`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
function thumbHTML(m){
  if(m.type==='image')return `<img src="${esc(m.src)}" alt="" loading="lazy">`;
  if(m.type==='youtube')return `<img src="${ytThumb(esc(m.id))}" alt="" loading="lazy">`;
  return `<video src="${esc(m.src)}#t=0.5" muted playsinline preload="metadata"></video>`;
}

/* ---------- math ---------- */
function layout(c,b,o,h){
  const lid=b.hasLid&&b.lidOn;
  const fw0=Math.max(b.tw,b.bw,lid?b.lw:0),fd0=Math.max(b.td,b.bd,lid?b.ld:0);
  const fw=o?fd0:fw0,fd=o?fw0:fd0;
  const unitH=b.h+(lid?b.lh:0);
  const tapered=(b.tw-b.bw>0.05)||(b.td-b.bd>0.05);
  const nestBlock=b.stack&&tapered&&!lid,canStack=b.stack&&!nestBlock;
  const pitch=Math.max(0.5,unitH-(canStack?(b.nest||0):0));
  const g=c.gap,aW=c.w-c.sgap,aD=c.d+c.over,aH=h-c.tgap,e=1e-9;
  const fit=(a,s)=>(s>0&&s<=a+e)?Math.floor((a+g+e)/(s+g)):0;
  const cols=fit(aW,fw),rows=fit(aD,fd);
  let layers=0;if(unitH>0&&unitH<=aH+e)layers=canStack?Math.floor((aH-unitH+e)/pitch)+1:1;
  const per=cols*rows*layers;
  const usedW=cols?cols*fw+(cols-1)*g:0,usedD=rows?rows*fd+(rows-1)*g:0,usedH=layers?unitH+(layers-1)*pitch:0;
  return{o,h,fw,fd,unitH,pitch,cols,rows,layers,per,usedW,usedD,usedH,lid,tapered,nestBlock,canStack,
    leftW:c.w-usedW,leftD:Math.max(0,c.d-usedD),leftH:h-usedH,protrude:Math.max(0,usedD-c.d),
    failW:fw>aW+e,failD:fd>aD+e,failH:unitH>aH+e};
}
function planLevels(c,levelBoxes,boxOf,mode){
  const ori={};
  [...new Set(levelBoxes.filter(Boolean))].forEach(id=>{
    const b=boxOf(id);if(!b)return;
    const idx=levelBoxes.map((x,i)=>x===id?i:-1).filter(i=>i>=0);
    if(mode==='0'||mode==='1'){ori[id]=+mode;return;}
    const tot=o=>idx.reduce((s,i)=>s+layout(c,b,o,c.hs[i]).per,0);
    const pro=o=>layout(c,b,o,Math.max(...idx.map(i=>c.hs[i]))).protrude;
    const A=tot(0),B=tot(1);ori[id]=(B>A||(B===A&&B>0&&pro(1)<pro(0)))?1:0;
  });
  return c.hs.map((h,i)=>{const id=levelBoxes[i];const b=id&&boxOf(id);if(!b)return{h,id:null};return{h,id,b,L:layout(c,b,ori[id],h)};});
}
const sumQty=(lv,c)=>{const q={};lv.forEach(x=>{if(x.id)q[x.id]=(q[x.id]||0)+x.L.per*c.cols;});return q;};
function bodyVol(b){const am=((b.tw+b.bw)/2)*((b.td+b.bd)/2);return b.h/6*(b.tw*b.td+b.bw*b.bd+4*am);}
const spec=b=>`上 ${f1(b.tw)}×${f1(b.td)}／底 ${f1(b.bw)}×${f1(b.bd)}／高 ${f1(b.h)}${b.hasLid?`／蓋 ${f1(b.lh)}`:''}`;

/* ---------- state ---------- */
let comboId=(CATALOG.combos[0]||{}).id, filter='all', sel=-1, previewCombo=null;
function settings(){return{over:Math.max(0,num('cover')),gap:Math.max(0,num('gap')),sgap:Math.max(0,num('sgap')),tgap:Math.max(0,num('tgap'))};}
function comboCab(k){const base=typeof k.cabinet==='string'?CATALOG.cabinets[k.cabinet]:k.cabinet;if(!base)return null;return Object.assign({},base,{hs:(k.hs||base.hs).slice()});}
function comboPlan(k){const cab=comboCab(k);if(!cab)return null;const c=Object.assign({},cab,settings());return{c,cab,lv:planLevels(c,k.levels,id=>CATALOG.boxes[id],'auto')};}

/* ---------- lightbox ---------- */
function openLightbox(list,start){
  if(!list.length)return;
  const tr=$('lbTrack');
  tr.innerHTML=list.map(m=>{
    if(m.type==='image')return `<div class="lbslide"><img src="${esc(m.src)}" alt=""></div>`;
    if(m.type==='video')return `<div class="lbslide"><video src="${esc(m.src)}" controls playsinline preload="metadata"></video></div>`;
    return `<div class="lbslide"><iframe class="${m.wide?'wide':''}" src="https://www.youtube-nocookie.com/embed/${esc(m.id)}?playsinline=1&rel=0" title="影片" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
  }).join('');
  $('lightbox').hidden=false;document.body.style.overflow='hidden';
  const upd=()=>{const i=Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth));$('lbCount').textContent=list.length>1?`${i+1} / ${list.length}`:'';};
  tr.onscroll=upd;requestAnimationFrame(()=>{tr.scrollLeft=start*tr.clientWidth;upd();});
  $('lbClose').focus();
}
function closeLightbox(){$('lightbox').hidden=true;$('lbTrack').innerHTML='';document.body.style.overflow='';}
$('lbClose').addEventListener('click',closeLightbox);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('lightbox').hidden)closeLightbox();});

/* ---------- combo mode ---------- */
function drawFilters(){
  const used=[...new Set(CATALOG.combos.map(k=>typeof k.cabinet==='string'?k.cabinet:null).filter(k=>k&&CATALOG.cabinets[k]))];
  const opts=[['all','全部'],...used.map(k=>[k,CATALOG.cabinets[k].short||CATALOG.cabinets[k].name])];
  $('filters').innerHTML=opts.map(([k,t])=>`<button type="button" class="fchip" data-f="${esc(k)}" aria-pressed="${k===filter}">${esc(t)}</button>`).join('');
  $('filters').querySelectorAll('button').forEach(bt=>bt.addEventListener('click',()=>{filter=bt.dataset.f;drawFilters();drawCombos();}));
}
function drawCombos(){
  const list=CATALOG.combos.filter(k=>filter==='all'||k.cabinet===filter);
  $('combos').innerHTML=list.map(k=>{
    const p=comboPlan(k);if(!p)return '';
    const q=sumQty(p.lv,p.c),tot=Object.values(q).reduce((a,b)=>a+b,0);
    const dots=Object.keys(q).map(id=>`<i style="background:var(${colorVar(id)})"></i>`).join('')+(p.lv.some(x=>!x.id)?'<i style="background:var(--book)"></i>':'');
    return `<button type="button" class="ccard" data-id="${esc(k.id)}" aria-current="${k.id===comboId}">
      <span class="cab">${esc(p.cab.short||p.cab.name)}</span><span class="ttl">${esc(k.title)}</span>
      <span class="meta"><span class="dots">${dots}</span><b>${tot} 盒</b></span></button>`;
  }).join('');
  $('combos').querySelectorAll('.ccard').forEach(bt=>bt.addEventListener('click',()=>{comboId=bt.dataset.id;sel=-1;drawCombos();render();setView('angle');}));
  const cur=$('combos').querySelector('[aria-current="true"]');if(cur)cur.scrollIntoView({block:'nearest',inline:'nearest'});
}
function levelTable(lv,c,withBox){
  return `<div class="tw"><table class="lvtable"><thead><tr><th>層</th><th>淨高</th>${withBox?'<th>放什麼</th>':''}<th>左右×前後×疊</th><th>數量</th></tr></thead><tbody>${
    lv.map((x,i)=>{
      if(!x.id)return `<tr class="${i===sel?'sel':''}" data-lv="${i}"><td>${i+1}</td><td class="n">${f1(x.h)}</td>${withBox?'<td><i class="sw" style="background:var(--book)"></i>放書</td>':''}<td class="n">–</td><td class="n">–</td></tr>`;
      const L=x.L,fitTxt=L.per?`${L.cols}×${L.rows}×${L.layers}`:(L.failH?`太矮`:'放不下');
      return `<tr class="${L.per?'':'bad'} ${i===sel?'sel':''}" data-lv="${i}"><td>${i+1}</td><td class="n">${f1(x.h)}</td>${withBox?`<td><i class="sw" style="background:var(${colorVar(x.id)})"></i>${esc(shortName(x.b.name))}</td>`:''}<td class="n">${fitTxt}</td><td class="n">${L.per*c.cols}</td></tr>`;
    }).join('')}</tbody></table></div>`;
}
function bindRows(root){
  root.querySelectorAll('tr[data-lv]').forEach(tr=>tr.addEventListener('click',()=>{
    sel=+tr.dataset.lv;render();setView('cell');
    if(window.matchMedia('(max-width:899px)').matches)$('stage').scrollIntoView({behavior:'smooth',block:'start'});
  }));
}
function buyLink(u,label,primary){return u?`<a class="buy ${primary?'primary':''}" href="${esc(u)}" target="_blank" rel="noopener sponsored">${label}</a>`:`<span class="buy off">${label}連結待補</span>`;}
let lvOpen=null;
function renderCombo(){
  const k=CATALOG.combos.find(x=>x.id===comboId)||CATALOG.combos[0];
  if(!k){$('result').innerHTML='<p class="note">還沒有推薦組合。</p>';$('shop').innerHTML='';return;}
  comboId=k.id;
  const p=comboPlan(k);if(!p){$('result').innerHTML='<p class="note">這個組合的櫃子資料不見了。</p>';return;}
  const {c,cab,lv}=p,q=sumQty(lv,c),ids=Object.keys(q),total=Object.values(q).reduce((a,b)=>a+b,0);
  const bad=lv.filter(x=>x.id&&x.L.per===0).length,pro=lv.some(x=>x.id&&x.L.protrude>0);
  const allV=ids.length&&ids.every(id=>CATALOG.boxes[id].verified);
  const chips=[bad?['warn',`${bad} 層放不下`]:pro?['warn','部分凸出櫃外']:['ok','每層都放得下'],allV?['ok','已實測']:['','尺寸計算']];
  const cm=mediaOf(k);
  $('result').innerHTML=`
    <div class="rhead"><span>${esc(cab.name)}</span>${chips.map(([t,s])=>`<span class="chip ${t}">${s}</span>`).join('')}</div>
    <h2>${esc(k.title)}</h2>
    ${k.note?`<p class="note">${esc(k.note)}</p>`:''}
    ${cm.length?`<div class="gallery">${cm.map((m,i)=>`<button type="button" class="gthumb" data-i="${i}" aria-label="看第 ${i+1} 個">${thumbHTML(m)}${m.type!=='image'?'<span class="play">▶ 影片</span>':''}</button>`).join('')}</div>`:''}
    <div class="total">這組要買 <b>${total}</b> 個收納盒</div>`;
  $('result').querySelectorAll('.gthumb').forEach(bt=>bt.addEventListener('click',()=>openLightbox(cm,+bt.dataset.i)));

  const items=ids.map(id=>{
    const b=CATALOG.boxes[id],m=mediaOf(b),first=m[0];
    return `<div class="item">
      <button type="button" class="ithumb" data-box="${esc(id)}" ${m.length?'':'disabled'} aria-label="看 ${esc(b.name)} 的照片">
        <span class="sw" style="background:var(${colorVar(id)})"></span>
        ${first?thumbHTML(first):'實拍<br>待補'}
        ${m.length>1?`<span class="more">+${m.length-1}</span>`:first&&first.type!=='image'?'<span class="more">▶</span>':''}
      </button>
      <div class="ibody">
        <span class="badge ${b.verified?'v':'c'}">${b.verified?'已實測':'尺寸計算'}</span>
        <span class="iname">${esc(b.name)}</span>
        <span class="ispec">${spec(b)}</span>
        <span class="iqty">需要 <b>${q[id]}</b> 個</span>
        <div class="buys">${buyLink(b.links&&b.links.shopee,'蝦皮',true)}${buyLink(b.links&&b.links.coupang,'酷澎',false)}</div>
      </div></div>`;}).join('');
  if(lvOpen===null)lvOpen=window.matchMedia('(min-width:900px)').matches;
  $('shop').innerHTML=`<h3>購買清單</h3><div class="items">${items||'<p class="note">這組沒有用到收納盒。</p>'}</div>
    <details class="lv" id="lvDetails" ${lvOpen?'open':''}><summary>每層怎麼擺</summary>${levelTable(lv,c,true)}</details>`;
  $('lvDetails').addEventListener('toggle',e=>{lvOpen=e.target.open;});
  $('shop').querySelectorAll('.ithumb[data-box]').forEach(bt=>bt.addEventListener('click',()=>openLightbox(mediaOf(CATALOG.boxes[bt.dataset.box]),0)));
  bindRows($('shop'));
  $('barQty').textContent=total;
  build(c,lv);
}

/* ---------- lab mode ---------- */
let hs=[];
const LABCAB=()=>Object.assign({},CATALOG.cabinets,{custom:{name:'自訂櫃子',w:60,d:30,cols:1,hs:[30,30,30]}});
const LABBOX=()=>Object.assign({},CATALOG.boxes,{custom:{name:'自訂收納盒',tw:30,td:20,bw:28,bd:18,h:15,hasLid:false,lw:30.5,ld:20.5,lh:1.5,lidOn:false,stack:false,nest:0}});
function fillSelect(s,obj,extra){const keep=s.value;s.innerHTML=(extra||'')+Object.keys(obj).map(k=>`<option value="${esc(k)}">${esc(obj[k].name)}</option>`).join('');if([...s.options].some(o=>o.value===keep))s.value=keep;}
function drawLevels(){
  const box=$('levels');box.innerHTML='';
  hs.forEach((h,i)=>{
    const r=document.createElement('div');r.className='lvrow'+(i===sel?' sel':'');
    r.innerHTML=`<span>第 ${i+1} 層</span><div class="unit" data-u="cm"><input id="lv${i}" type="number" inputmode="decimal" step="0.1" min="3" value="${h}" aria-label="第 ${i+1} 層淨高"></div>
      <button type="button" class="iconbtn" aria-label="刪除第 ${i+1} 層" ${hs.length<=1?'disabled':''}>×</button>`;

async function gh(path,opt){

  if(!r.ok){let m='';try{m=(await r.json()).message;}catch(e){}

    if(r.status===403||r.status===404)throw new Error('金鑰沒有寫入 sideby 的權限（需要 Contents: Read and write）。');

async function commitFiles(files,message){

  for(let i=0;i<files.length;i++){status(`上傳中 ${i+1}/${files.length}…`);
    const b=await gh('/git/blobs',{method:'POST',body:JSON.stringify({content:files[i].b64,encoding:'base64'})});
    tree.push({path:files[i].path,mode:'100644',type:'blob',sha:b.sha});}
  const t=await gh('/git/trees',{method:'POST',body:JSON.stringify({base_tree:cm.tree.sha,tree})});
  const c=await gh('/git/commits',{method:'POST',body:JSON.stringify({message,tree:t.sha,parents:[base]})});

}
async function imageToJpeg(file){

  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,sizeAttenuation:false,transparent:true}));
  sp.renderOrder=1000;sp.userData.aspect=cv.width/cv.height;sp.position.copy(pos);group.add(sp);labels.push(sp);}
function dimLine(a,b,text,warn,at){const v=new THREE.Vector3().subVectors(b,a);if(v.length()<0.05)return;
  const vert=Math.abs(v.y)>Math.max(Math.abs(v.x),Math.abs(v.z)),tk=(vert?new THREE.Vector3(1,0,0):new THREE.Vector3(0,1,0)).multiplyScalar(1.2);
  const geo=new THREE.BufferGeometry().setFromPoints([a,b,a.clone().add(tk),a.clone().sub(tk),b.clone().add(tk),b.clone().sub(tk)]);
  const ln=new THREE.LineSegments(geo,warn?mats.dimWarn:mats.dim);ln.renderOrder=999;group.add(ln);makeLabel(text,at||a.clone().add(b).multiplyScalar(.5),warn);}
function clearGroup(){labels=[];while(group.children.length){const o=group.children.pop();o.geometry&&o.geometry.dispose();if(o.isSprite){o.material.map.dispose();o.material.dispose();}}
  boxMats.forEach(m=>m.dispose());boxMats=[];}
function matFor(v,dark){const m=new THREE.MeshStandardMaterial({roughness:dark?.5:.6});m.color.set(css(v));if(dark)m.color.multiplyScalar(.72);boxMats.push(m);return m;}
let firstBuild=true;
function build(c,lv,colorMap){
  if(!renderer)return;clearGroup();
  const t=1.8,nc=c.cols,n=c.hs.length,D=c.d,W=nc*c.w+(nc+1)*t,H=c.hs.reduce((s,h)=>s+h+t,0)+t;
  const floors=[];let y=t;for(let i=n-1;i>=0;i--){floors[i]=y;y+=c.hs[i]+t;}
  for(let i=0;i<n;i++)addMesh(new THREE.BoxGeometry(W,t,D),mats.wood,0,floors[i]-t/2,0,mats.woodEdge);
  addMesh(new THREE.BoxGeometry(W,t,D),mats.wood,0,H-t/2,0,mats.woodEdge);
  for(let j=0;j<=nc;j++){const outer=(j===0||j===nc);addMesh(new THREE.BoxGeometry(t,H,D),outer?mats.side:mats.wood,-W/2+t/2+j*(c.w+t),H/2,0,mats.woodEdge);}
  addMesh(new THREE.BoxGeometry(W,H,0.4),mats.wood,0,H/2,-D/2-0.2,mats.woodEdge);
  const focus=sel>=0?sel:lv.findIndex(x=>x.id&&x.L.per>0);
  const cache={};
  const geoFor=(id,b,o,lidOn)=>{const key=id+'_'+o;if(cache[key])return cache[key];
    const sw=o?(x=>[x[1],x[0]]):(x=>x),[tw,td]=sw([b.tw,b.td]),[bw,bd]=sw([b.bw,b.bd]),[lw,ld]=sw([b.lw,b.ld]),cv=(colorMap&&colorMap[id])||colorVar(id);
    return cache[key]={body:taper(tw,td,bw,bd,b.h),lid:lidOn&&b.lh>0?new THREE.BoxGeometry(lw,b.lh,ld):null,bm:matFor(cv,false),lm:matFor(cv,true)};};
  lv.forEach((x,i)=>{
    const y0=floors[i];
    for(let j=0;j<nc;j++){const x0=-W/2+t+j*(c.w+t);
      if(!x.id){let bx=x0+0.4,k=0;const bh=[.82,.9,.76,.88,.8,.93,.85];
        while(bx<x0+c.w-4.5){const th=2.4+(k%3)*.7,hh=Math.min(x.h-1,x.h*bh[k%7]),dd=Math.min(D-1,22);
          addMesh(new THREE.BoxGeometry(th,hh,dd),mats.book,bx+th/2,y0+hh/2,D/2-dd/2-0.5,mats.woodEdge);bx+=th+0.15;k++;}continue;}
      const L=x.L,G=geoFor(x.id,x.b,L.o,L.lid),front=L.usedD<=D?D/2:-D/2+L.usedD;
      for(let r=0;r<L.rows;r++)for(let k=0;k<L.cols;k++)for(let s=0;s<L.layers;s++){
        const cx=x0+k*(L.fw+c.gap)+L.fw/2,cz=front-r*(L.fd+c.gap)-L.fd/2,yy=y0+s*L.pitch,out=cz+L.fd/2>D/2+0.01;
        addMesh(G.body,out?mats.warn:G.bm,cx,yy,cz);if(G.lid)addMesh(G.lid,out?mats.warn:G.lm,cx,yy+x.b.h+x.b.lh/2,cz);}}
    if(i===sel){const g=new THREE.BoxGeometry(c.w,x.h,D),e=new THREE.LineSegments(new THREE.EdgesGeometry(g),mats.selEdge);
      e.position.set(-W/2+t+c.w/2,y0+x.h/2,0);e.renderOrder=998;group.add(e);g.dispose();}
    if(!showDims||!x.id)return;
    const compact=stage.clientHeight<560&&curView!=='cell',isFocus=i===focus;
    if(compact&&!isFocus)return;
    const L=x.L,x0=-W/2+t,xR=x0+c.w,zF=D/2+0.3,front=L.usedD<=D?D/2:-D/2+L.usedD;
    if(L.per===0){makeLabel(L.failH?`第 ${i+1} 層太矮：差 ${f1(L.unitH-(L.h-c.tgap))} cm`:'放不下',new THREE.Vector3(x0+c.w/2,y0+L.h/2,zF),true);return;}
    if(L.leftH>=0.3){const xm=x0+Math.min(L.usedW,c.w)/2;dimLine(new THREE.Vector3(xm,y0+L.usedH,zF),new THREE.Vector3(xm,y0+L.h,zF),`上方剩 ${f1(L.leftH)}`,false);}
    if(L.leftW>=0.3){const yy=y0+Math.min(L.usedH,L.h)*0.35;dimLine(new THREE.Vector3(x0+L.usedW,yy,zF),new THREE.Vector3(xR,yy,zF),`右側剩 ${f1(L.leftW)}`,false);}
    const yb=y0+Math.min(L.usedH,L.h)*0.85,xb=x0+Math.min(2.5,L.usedW*0.15);
    if(!isFocus&&curView!=='side')return;
    if(L.protrude>0)dimLine(new THREE.Vector3(xb,yb,D/2),new THREE.Vector3(xb,yb,D/2+L.protrude),`凸出 ${f1(L.protrude)}`,true,new THREE.Vector3(xb,yb+3,D/2+L.protrude));
    else if(L.leftD>=0.3)dimLine(new THREE.Vector3(xb,yb,-D/2),new THREE.Vector3(xb,yb,front-L.usedD),`後方剩 ${f1(L.leftD)}`,false);
  });
  scaleLabels();dims={W,H,D,c,t,floors};
  if(firstBuild){setView('angle');firstBuild=false;}
}
let curView='angle';
function setView(v){
  curView=v;document.querySelectorAll('.views button[data-view]').forEach(bt=>bt.setAttribute('aria-pressed',bt.dataset.view===v?'true':'false'));
  if(!renderer||!dims)return;
  const{W,H,D,c,t,floors}=dims,aspect=Math.max(.45,camera.aspect||1.5);let tgt,pos;
  if(v==='cell'){const i=sel>=0&&sel<c.hs.length?sel:0,h=c.hs[i],x=-W/2+t+c.w/2,y=floors[i]+h/2,R=Math.max(c.w/aspect,h)*2.1+D;
    tgt=new THREE.Vector3(x,y,0);pos=new THREE.Vector3(x+R*.38,y+R*.22,R);}
  else{const R=Math.max(W/aspect,H)*2.05;tgt=new THREE.Vector3(0,H/2,0);
    if(v==='front')pos=new THREE.Vector3(0,H/2,R);else if(v==='side')pos=new THREE.Vector3(R,H/2,R*.1);else pos=new THREE.Vector3(R*.5,H*.62,R*.88);}
  controls.target.copy(tgt);camera.position.copy(pos);controls.update();
}
document.querySelectorAll('.views button[data-view]').forEach(bt=>bt.addEventListener('click',()=>{if(bt.dataset.view==='cell'&&sel<0)sel=0;curView=bt.dataset.view;render();setView(bt.dataset.view);}));
$('dimToggle').addEventListener('click',()=>{showDims=!showDims;$('dimToggle').setAttribute('aria-pressed',String(showDims));render();});

/* ---------- wiring ---------- */
function render(){isLab()?renderLab():renderCombo();}
let raf=0;function schedule(){cancelAnimationFrame(raf);raf=requestAnimationFrame(render);}
function applyMode(){
  const lab=isLab();
  $('labPanel').hidden=!lab;$('picker').hidden=lab;$('labTag').hidden=!lab;$('foot').hidden=lab;$('shop').hidden=false;
  document.body.classList.toggle('hasbar',!lab);updateBar();
  previewCombo=null;sel=-1;render();setView('angle');
}
const barIO='IntersectionObserver' in window?new IntersectionObserver(es=>{shopVisible=es.some(e=>e.isIntersecting);updateBar();},{rootMargin:'0px 0px -40% 0px'}):null;
let shopVisible=false;
function updateBar(){$('buybar').hidden=isLab()||shopVisible;}
if(barIO)barIO.observe($('shop'));
$('barBtn').addEventListener('click',()=>$('shop').scrollIntoView({behavior:'smooth',block:'start'}));

['cw','cd','ccols'].forEach(id=>$(id).addEventListener('input',()=>{$('cabPreset').value='custom';labChanged();}));
['bname','btw','btd','bbw','bbd','bh','bhasLid','blidOn','blw','bld','blh','bstack','bnest'].forEach(id=>$(id).addEventListener('input',()=>{if(id!=='bname')$('boxPreset').value='custom';syncLid();labChanged();}));
['cover','gap','sgap','tgap','orient'].forEach(id=>$(id).addEventListener('input',schedule));
$('cabPreset').addEventListener('change',e=>{applyCab(e.target.value);labChanged(true);setView('angle');});
$('boxPreset').addEventListener('change',e=>{const b=LABBOX()[e.target.value];if(b)applyBoxObj(b);labChanged(true);});
window.addEventListener('hashchange',applyMode);

refreshPubSelects();
const firstCab=Object.keys(CATALOG.cabinets)[0]||'custom',firstBox=Object.keys(CATALOG.boxes)[0]||'custom';
$('cabPreset').value=firstCab;applyCab(firstCab);$('boxPreset').value=firstBox;applyBoxObj(LABBOX()[firstBox]);
$('cover').value=DEF.over;$('gap').value=DEF.gap;$('sgap').value=DEF.sgap;$('tgap').value=DEF.tgap;
const ok=initGL();
if(!ok){const d=document.createElement('div');d.className='nogl';d.textContent='這個瀏覽器無法顯示 3D 畫面，下方的擺法和購買清單仍然可以使用。';stage.appendChild(d);}
drawFilters();drawCombos();applyMode();
if(ok){
  const re=()=>{colorize();render();};
  const mq=window.matchMedia('(prefers-color-scheme: dark)');mq.addEventListener&&mq.addEventListener('change',re);
  new MutationObserver(re).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>render());
}
})();
</script>
